
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churel MCQ Quiz</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: linear-gradient(135deg, #090909, #211027, #090909);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      width: 100%;
      max-width: 720px;
      padding: 30px;
      border: 1px solid #713b83;
      border-radius: 18px;
      background: rgba(20, 15, 24, .96);
      box-shadow: 0 0 35px rgba(164, 65, 210, .18);
    }

    h1 {
      text-align: center;
      color: #d99cff;
      margin-top: 0;
    }

    .muted {
      color: #b9aabd;
      text-align: center;
    }

    .progress {
      height: 8px;
      background: #39313e;
      border-radius: 20px;
      overflow: hidden;
      margin: 24px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #c36bff;
      transition: width .3s;
    }

    #question {
      font-size: 21px;
      line-height: 1.6;
      margin: 20px 0;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #51415c;
      border-radius: 10px;
      background: #211b28;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      border-color: #d18aff;
    }

    .option.selected {
      background: #56306c;
      border-color: #d18aff;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .controls button, .primary-btn {
      border: 0;
      border-radius: 9px;
      padding: 13px 22px;
      font-weight: bold;
      cursor: pointer;
      background: #bd65ef;
      color: #160b1c;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      color: #ffc6c6;
      margin-top: 18px;
    }

    #result {
      text-align: center;
      padding: 25px 0;
    }

    .score {
      font-size: 42px;
      color: #d99cff;
      font-weight: bold;
    }

    .hidden { display: none; }

    @media (max-width: 500px) {
      .quiz-card { padding: 20px; }
      #question { font-size: 18px; }
      .controls button { padding: 12px; }
    }
    .back-website {
  display: inline-block;
  text-decoration: none;
  color: white;
  background: #593276;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
  margin-bottom: 22px;
  transition: 0.3s;
}

.back-website:hover {
  background: #bd65ef;
  transform: translateY(-2px);
  display: inline-block;
}
  </style>
  <script type="module" crossorigin src="/churel-24-ghnata-portal/assets/quiz-BOiG0qEJ.js"></script>
  <link rel="modulepreload" crossorigin href="/churel-24-ghnata-portal/assets/index-B5YLfHZW.js">
</head>

<body>
  <main class="quiz-card">
    <a href="https://sayanraul387-hue.github.io/churel-24-ghnata-portal/website.html"
   class="back-website">
   ← Back to Website
</a>
    <h1>চুড়েল MCQ Quiz</h1>
    <p class="muted">আপনি চুড়েলকে কতটা জানেন?</p>

    <div id="loading" class="muted">Loading Quiz...</div>

    <section id="quizArea" class="hidden">
      <h2 id="quizTitle"></h2>
      <p id="quizDescription" class="muted"></p>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="questionCount" class="muted"></p>
      <div id="question"></div>
      <div id="options"></div>

      <div class="controls">
        <button id="previousBtn" type="button">← Previous</button>
        <button id="nextBtn" type="button">Next →</button>
        <button id="submitBtn" class="hidden" type="button">Submit Quiz</button>
      </div>
    </section>

    <section id="result" class="hidden">
      <h2>Quiz Completed!</h2>
      <p>Your Score</p>
      <div class="score" id="scoreText"></div>
      <p id="resultMessage"></p>
      <button class="primary-btn" onclick="location.reload()">
        Try Again
      </button>
    </section>

    <p id="status"></p>
  </main>

</body>
</html>
