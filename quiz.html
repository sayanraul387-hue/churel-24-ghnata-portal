
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churel MCQ Quiz</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: linear-gradient(135deg, #090909, #211027, #090909);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      width: 100%;
      max-width: 720px;
      padding: 30px;
      border: 1px solid #713b83;
      border-radius: 18px;
      background: rgba(20, 15, 24, .96);
      box-shadow: 0 0 35px rgba(164, 65, 210, .18);
    }

    h1 {
      text-align: center;
      color: #d99cff;
      margin-top: 0;
    }

    .muted {
      color: #b9aabd;
      text-align: center;
    }

    .progress {
      height: 8px;
      background: #39313e;
      border-radius: 20px;
      overflow: hidden;
      margin: 24px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #c36bff;
      transition: width .3s;
    }

    #question {
      font-size: 21px;
      line-height: 1.6;
      margin: 20px 0;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #51415c;
      border-radius: 10px;
      background: #211b28;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      border-color: #d18aff;
    }

    .option.selected {
      background: #56306c;
      border-color: #d18aff;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .controls button, .primary-btn {
      border: 0;
      border-radius: 9px;
      padding: 13px 22px;
      font-weight: bold;
      cursor: pointer;
      background: #bd65ef;
      color: #160b1c;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      color: #ffc6c6;
      margin-top: 18px;
    }

    #result {
      text-align: center;
      padding: 25px 0;
    }

    .score {
      font-size: 42px;
      color: #d99cff;
      font-weight: bold;
    }

    .hidden { display: none; }

    @media (max-width: 500px) {
      .quiz-card { padding: 20px; }
      #question { font-size: 18px; }
      .controls button { padding: 12px; }
    }
    .back-website {
  display: inline-block;
  text-decoration: none;
  color: white;
  background: #593276;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
  margin-bottom: 22px;
  transition: 0.3s;
}

.back-website:hover {
  background: #bd65ef;
  transform: translateY(-2px);
  display: inline-block;
}#quizTitle,
#quizDescription {
    display: none !important;
}
  </style>
</head>

<body>
  <main class="quiz-card">
    <a href="https://sayanraul387-hue.github.io/churel-24-ghnata-portal/website.html"
   class="back-website">
   ← Back to Website
</a>
<h1>CHUREL 24 GHANTA QUIZ</h1>

    <div id="loading" class="muted">Loading Quiz...</div>

    <section id="quizArea" class="hidden">
      <h2 id="quizTitle"></h2>
      <p id="quizDescription" class="muted"></p>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="questionCount" class="muted"></p>
      <div id="question"></div>
      <div id="options"></div>

      <div class="controls">
        <button id="previousBtn" type="button">← Previous</button>
        <button id="nextBtn" type="button">Next →</button>
        <button id="submitBtn" class="hidden" type="button">Submit Quiz</button>
      </div>
    </section>

    <section id="result" class="hidden">
      <h2>Quiz Completed!</h2>
      <p>Your Score</p>
      <div class="score" id="scoreText"></div>
      <p id="resultMessage"></p>
      <button class="primary-btn" onclick="location.reload()">
        Try Again
      </button>
    </section>

    <p id="status"></p>
  </main>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
    const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;

    const supabase = createClient(supabaseUrl, supabaseKey);

    const QUIZ_ID = 1;

    let questions = [];
    let currentIndex = 0;
    let answers = {};

    const loading = document.getElementById('loading');
    const quizArea = document.getElementById('quizArea');
    const resultArea = document.getElementById('result');
    const status = document.getElementById('status');

    async function loadQuiz() {
      try {
        if (!supabaseUrl || !supabaseKey) {
          throw new Error('Supabase configuration পাওয়া যায়নি।');
        }

        const { data, error } = await supabase.rpc(
          'get_mcq_quiz',
          { p_quiz_id: QUIZ_ID }
        );

        if (error) throw error;
        if (!data) throw new Error('Quiz পাওয়া যায়নি।');

        questions = data.questions || [];

        if (questions.length === 0) {
          throw new Error('এই Quiz-এ কোনো প্রশ্ন নেই।');
        }

        document.getElementById('quizTitle').textContent = data.title;
        document.getElementById('quizDescription').textContent =
          data.description || '';

        loading.classList.add('hidden');
        quizArea.classList.remove('hidden');

        showQuestion();
      } catch (error) {
        loading.textContent = 'Quiz Load করা যায়নি।';
        status.textContent = error.message;
        console.error(error);
      }
    }

    function showQuestion() {
      const q = questions[currentIndex];

      document.getElementById('questionCount').textContent =
        `Question ${currentIndex + 1} of ${questions.length}`;

      document.getElementById('question').textContent =
        q.question;

      document.getElementById('progressBar').style.width =
        `${((currentIndex + 1) / questions.length) * 100}%`;

      const options = [
        ['A', q.option_a],
        ['B', q.option_b],
        ['C', q.option_c],
        ['D', q.option_d]
      ];

      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      options.forEach(([letter, text]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';

        if (answers[q.id] === letter) {
          button.classList.add('selected');
        }

        button.textContent = `${letter}. ${text}`;

        button.addEventListener('click', () => {
          answers[q.id] = letter;
          showQuestion();
        });

        optionsBox.appendChild(button);
      });

      document.getElementById('previousBtn').disabled =
        currentIndex === 0;

      document.getElementById('nextBtn').classList.toggle(
        'hidden',
        currentIndex === questions.length - 1
      );

      document.getElementById('submitBtn').classList.toggle(
        'hidden',
        currentIndex !== questions.length - 1
      );
    }

    document.getElementById('previousBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        showQuestion();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        showQuestion();
      }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const unanswered = questions.filter(q => !answers[q.id]);

      if (unanswered.length > 0) {
        status.textContent =
          `তুমি ${unanswered.length}টি প্রশ্নের উত্তর দাওনি।`;
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      status.textContent = '';

      try {
        const { data, error } = await supabase.rpc(
          'grade_mcq_quiz',
          {
            p_quiz_id: QUIZ_ID,
            p_answers: answers
          }
        );

        if (error) throw error;

        quizArea.classList.add('hidden');
        resultArea.classList.remove('hidden');

        document.getElementById('scoreText').textContent =
          `${data.score} / ${data.total}`;

        document.getElementById('resultMessage').textContent =
          data.score === data.total
            ? 'অসাধারণ! সব উত্তর সঠিক!'
            : 'Quiz সম্পন্ন হয়েছে। আবার চেষ্টা করতে পারো।';

      } catch (error) {
        status.textContent = 'Submit করা যায়নি: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Quiz';
      }
    });

    loadQuiz();
  </script>
</body>
</html>
